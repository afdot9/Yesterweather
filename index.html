<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesterweather</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1a2e">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1a2e; --paper:#f5f0e8; --cream:#ede8da; --rust:#c0392b; --muted:#7a7060; --line:#d4cfc0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font-family:'DM Mono',monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:40px 20px 80px; background-image:repeating-linear-gradient(0deg,transparent,transparent 27px,var(--line) 27px,var(--line) 28px); }
  header { text-align:center; margin-bottom:48px; }
  header::before { content:''; display:block; width:2px; height:40px; background:var(--ink); margin:0 auto 20px; }
  h1 { font-family:'Playfair Display',serif; font-size:clamp(2.4rem,6vw,4rem); font-weight:700; letter-spacing:-0.02em; line-height:1; }
  h1 em { font-style:italic; color:var(--rust); }
  .subtitle { font-size:0.7rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--muted); margin-top:10px; }

  .card { width:100%; max-width:660px; background:white; border:1px solid var(--ink); box-shadow:4px 4px 0 var(--ink); padding:32px; margin-bottom:24px; }
  .section-label { font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .input-row { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  input[type="text"], input[type="date"], input[type="number"], select {
    flex:1; padding:10px 14px; border:1px solid var(--ink); background:var(--cream);
    font-family:'DM Mono',monospace; font-size:0.85rem; color:var(--ink); outline:none;
    transition:box-shadow 0.15s; appearance:none; -webkit-appearance:none;
  }
  input:focus, select:focus { box-shadow:2px 2px 0 var(--ink); }

  .top-controls { display:flex; gap:10px; margin-bottom:24px; align-items:stretch; }
  .mode-toggle { display:flex; flex:1; border:1px solid var(--ink); }
  .mode-btn { flex:1; padding:10px 6px; background:transparent; border:none; font-family:'DM Mono',monospace; font-size:0.68rem; letter-spacing:0.05em; cursor:pointer; color:var(--muted); transition:all 0.15s; text-align:center; white-space:nowrap; }
  .mode-btn.active { background:var(--ink); color:var(--paper); }
  .mode-btn:not(.active):hover { background:var(--cream); color:var(--ink); }
  .unit-toggle { display:flex; border:1px solid var(--ink); }
  .unit-btn { padding:10px 14px; background:transparent; border:none; font-family:'DM Mono',monospace; font-size:0.75rem; cursor:pointer; color:var(--muted); transition:all 0.15s; }
  .unit-btn.active { background:var(--ink); color:var(--paper); }
  .unit-btn:not(.active):hover { background:var(--cream); color:var(--ink); }

  .btn { padding:10px 18px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-family:'DM Mono',monospace; font-size:0.75rem; letter-spacing:0.08em; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
  .btn:hover:not(:disabled) { background:var(--rust); border-color:var(--rust); }
  .btn:active:not(:disabled) { transform:translate(2px,2px); }
  .btn:disabled { opacity:0.45; cursor:not-allowed; }
  .btn-outline { background:transparent; color:var(--ink); }
  .btn-outline:hover:not(:disabled) { background:var(--cream); }

  .hint { font-size:0.65rem; color:var(--muted); margin-top:-10px; margin-bottom:14px; line-height:1.5; }

  #status { font-size:0.75rem; color:var(--muted); min-height:20px; margin-top:10px; }
  #results { width:100%; max-width:660px; display:none; }

  /* Single result */
  .result-header { border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:24px; }
  .result-place { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:700; line-height:1.1; }
  .result-date { font-size:0.72rem; color:var(--muted); letter-spacing:0.12em; margin-top:4px; }
  .weather-icon { font-size:3.5rem; line-height:1; margin:20px 0 12px; }
  .temp-main { font-family:'Playfair Display',serif; font-size:3.2rem; font-weight:700; letter-spacing:-0.03em; }
  .temp-range { font-size:0.78rem; color:var(--muted); margin-top:2px; }
  .condition-text { font-family:'Playfair Display',serif; font-style:italic; font-size:1.15rem; color:var(--rust); margin:10px 0 24px; }
  .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--ink); border:1px solid var(--ink); margin-bottom:24px; }
  .stat { background:white; padding:16px 14px; text-align:center; }
  .stat-val { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:700; }
  .stat-label { font-size:0.6rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
  .hourly-title { font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .hourly-chart { display:flex; align-items:flex-end; gap:3px; height:70px; margin-bottom:6px; }
  .hour-bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
  .hour-bar { width:100%; background:var(--ink); min-height:2px; position:relative; transition:background 0.15s; }
  .hour-bar:hover { background:var(--rust); }
  .hour-bar-tip { display:none; position:absolute; bottom:calc(100% + 4px); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-size:0.6rem; padding:3px 6px; white-space:nowrap; z-index:10; pointer-events:none; }
  .hour-bar:hover .hour-bar-tip { display:block; }
  .hour-labels { display:flex; gap:3px; }
  .hour-label { flex:1; text-align:center; font-size:0.52rem; color:var(--muted); }

  /* Year accordion */
  .year-block { border-bottom:2px solid var(--ink); margin-bottom:0; }
  .year-block:last-child { border-bottom:none; }
  .year-header { display:flex; align-items:center; justify-content:space-between; padding:16px 0; cursor:pointer; user-select:none; }
  .year-header:hover .year-title { color:var(--rust); }
  .year-title { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:700; transition:color 0.15s; }
  .year-summary { font-size:0.72rem; color:var(--muted); text-align:right; }
  .year-arrow { font-size:0.75rem; color:var(--muted); margin-left:12px; transition:transform 0.2s; }
  .year-arrow.open { transform:rotate(180deg); }
  .year-days { overflow:hidden; max-height:0; transition:max-height 0.35s ease; }
  .year-days.open { max-height:2000px; }

  /* Day rows inside year */
  .day-row { display:grid; grid-template-columns:110px 1fr auto; align-items:center; gap:10px; padding:10px 0 10px 16px; border-bottom:1px solid var(--line); }
  .day-row:last-child { border-bottom:none; }
  .day-name { font-family:'Playfair Display',serif; font-size:0.95rem; font-weight:700; }
  .day-date { font-size:0.6rem; color:var(--muted); margin-top:1px; }
  .day-condition { font-size:0.65rem; color:var(--muted); }
  .day-temps { font-family:'Playfair Display',serif; font-size:1rem; font-weight:700; white-space:nowrap; text-align:right; }
  .day-temps-sub { font-size:0.58rem; color:var(--muted); text-align:right; margin-top:1px; }

  /* Loading states */
  .loading-row { padding:12px 0; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .loading-bar { flex:1; height:8px; background:var(--line); overflow:hidden; }
  .loading-shimmer { width:40%; height:100%; background:linear-gradient(90deg,var(--line),var(--cream),var(--line)); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }

  /* Single year timeline (for "every year" single day mode) */
  .year-row { display:grid; grid-template-columns:60px 1fr auto; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); }
  .year-row:last-child { border-bottom:none; }
  .year-label { font-family:'Playfair Display',serif; font-size:1.1rem; font-weight:700; }
  .year-bar-track { height:8px; background:var(--cream); border:1px solid var(--line); }
  .year-bar-fill { height:100%; transition:width 0.6s ease; }
  .year-bar-fill.cold{background:#4a90d9} .year-bar-fill.cool{background:#7ab8e8}
  .year-bar-fill.mild{background:#f0c040} .year-bar-fill.warm{background:#e8834a}
  .year-bar-fill.hot{background:var(--rust)}
  .year-meta { text-align:right; white-space:nowrap; }
  .year-temp { font-family:'Playfair Display',serif; font-size:1.2rem; font-weight:700; }
  .year-cond { font-size:0.6rem; color:var(--muted); margin-top:2px; }
  .year-icon { font-size:1.3rem; margin-right:6px; vertical-align:middle; }

  .timeline-header { border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:28px; }
  .timeline-place { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:700; }
  .timeline-sub { font-size:0.7rem; color:var(--muted); letter-spacing:0.1em; margin-top:4px; }

  .error-msg { background:#fff5f5; border:1px solid var(--rust); padding:14px 18px; color:var(--rust); font-size:0.8rem; line-height:1.6; }
  .loading-spinner { display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--ink); border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .fade-up { animation:fadeUp 0.35s ease forwards; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<header>
  <h1><em>Yester</em>weather</h1>
  <p class="subtitle">Historical Weather Archive</p>
</header>

<div class="card">
  <div class="top-controls">
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeSingle" onclick="setMode('single')">Single day</button>
      <button class="mode-btn" id="modeRange" onclick="setMode('range')">Date range</button>
    </div>
    <div class="unit-toggle">
      <button class="unit-btn active" id="unitC" onclick="setUnit('C')">°C</button>
      <button class="unit-btn" id="unitF" onclick="setUnit('F')">°F</button>
    </div>
  </div>

  <p class="section-label">Location</p>
  <div class="input-row">
    <input type="text" id="locationInput" placeholder="e.g. Gothenburg, Los Angeles, Tokyo…" />
  </div>

  <!-- Single day -->
  <div id="singleSection">
    <p class="section-label">Date</p>
    <div class="input-row">
      <input type="date" id="dateInput" />
      <button class="btn btn-outline" onclick="quickDate('dateInput',-1)">Yesterday</button>
      <button class="btn btn-outline" onclick="quickDate('dateInput',-7)">Last week</button>
    </div>
    <p class="section-label">Repeat across years?</p>
    <div class="input-row" style="align-items:center">
      <input type="number" id="singleYears" value="1" min="1" max="80" style="max-width:80px;flex:none" />
      <span style="font-size:0.75rem;color:var(--muted);padding:10px 0">
        year(s) &nbsp;— <span style="color:var(--ink)">1 = just this date</span>
      </span>
    </div>
  </div>

  <!-- Date range -->
  <div id="rangeSection" class="hidden">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
      <div>
        <p class="section-label">From</p>
        <input type="date" id="dateFrom" style="flex:none;width:100%" />
      </div>
      <div>
        <p class="section-label">To</p>
        <input type="date" id="dateTo" style="flex:none;width:100%" />
      </div>
    </div>
    <p class="section-label">Repeat across years?</p>
    <div class="input-row" style="align-items:center">
      <input type="number" id="rangeYears" value="1" min="1" max="30" style="max-width:80px;flex:none" />
      <span style="font-size:0.75rem;color:var(--muted);padding:10px 0">
        year(s) &nbsp;— <span style="color:var(--ink)">e.g. 10 = same week for 10 years</span>
      </span>
    </div>
    <p class="hint">Max 7 days per range · Max 30 years</p>
  </div>

  <button class="btn" id="lookupBtn" style="width:100%;margin-top:8px;padding:14px" onclick="lookupWeather()">
    Look up the weather
  </button>
  <div id="status"></div>
</div>

<div id="results"></div>

<script>
  let mode = 'single', unit = 'C';

  // Init dates
  const tod = new Date(); tod.setHours(0,0,0,0);
  const yest = new Date(tod); yest.setDate(yest.getDate()-1);
  const wkAgo = new Date(tod); wkAgo.setDate(wkAgo.getDate()-7);

  ['dateInput','dateTo'].forEach(id => {
    document.getElementById(id).value = toISO(yest);
    document.getElementById(id).max = toISO(yest);
    document.getElementById(id).min = '1940-01-01';
  });
  document.getElementById('dateFrom').value = toISO(wkAgo);
  document.getElementById('dateFrom').max = toISO(yest);
  document.getElementById('dateFrom').min = '1940-01-01';

  function setMode(m) {
    mode = m;
    document.getElementById('modeSingle').classList.toggle('active', m==='single');
    document.getElementById('modeRange').classList.toggle('active', m==='range');
    document.getElementById('singleSection').classList.toggle('hidden', m!=='single');
    document.getElementById('rangeSection').classList.toggle('hidden', m!=='range');
    document.getElementById('results').style.display = 'none';
    setStatus('');
  }

  function setUnit(u) {
    unit = u;
    document.getElementById('unitC').classList.toggle('active', u==='C');
    document.getElementById('unitF').classList.toggle('active', u==='F');
  }

  function toISO(d) { return d.toISOString().split('T')[0]; }
  function quickDate(id, n) { const d=new Date(); d.setDate(d.getDate()+n); document.getElementById(id).value=toISO(d); }
  function toF(c) { return +c * 9/5 + 32; }
  function fmt(c) { return unit==='F' ? toF(c).toFixed(1)+'°F' : Number(c).toFixed(1)+'°C'; }
  function fmtS(c) { return unit==='F' ? toF(c).toFixed(0)+'°' : Number(c).toFixed(0)+'°'; }

  function setStatus(msg, loading=false) {
    document.getElementById('status').innerHTML = loading
      ? `<span class="loading-spinner"></span><span style="font-size:.75rem">${msg}</span>`
      : msg ? `<span style="font-size:.75rem;color:var(--muted)">${msg}</span>` : '';
  }
  function setLoading(on) { document.getElementById('lookupBtn').disabled = on; }

  // Build list of dates from a range string pair, offset by N years back
  function buildDates(from, to, yearsBack) {
    // Returns array of {year, dates:[]}
    const fromD = new Date(from+'T12:00:00');
    const toD   = new Date(to+'T12:00:00');
    const result = [];
    for (let y = 0; y < yearsBack; y++) {
      const dates = [];
      const cur = new Date(fromD); cur.setFullYear(cur.getFullYear() - y);
      const end = new Date(toD);   end.setFullYear(end.getFullYear() - y);
      while (cur <= end) { dates.push(toISO(cur)); cur.setDate(cur.getDate()+1); }
      result.push({ year: fromD.getFullYear() - y, dates });
    }
    return result;
  }

  async function lookupWeather() {
    if (mode === 'single') return lookupSingle();
    return lookupRange();
  }

  // --- Single day (with optional year repeat) ---
  async function lookupSingle() {
    const loc = document.getElementById('locationInput').value.trim();
    const date = document.getElementById('dateInput').value;
    const years = Math.min(80, Math.max(1, parseInt(document.getElementById('singleYears').value)||1));
    if (!loc) { setStatus('Please enter a location.'); return; }
    if (!date) { setStatus('Please select a date.'); return; }
    if (new Date(date+'T12:00:00') >= tod) { setStatus('Please choose a past date.'); return; }

    if (years === 1) {
      // Simple single result
      document.getElementById('results').style.display = 'none';
      setLoading(true); setStatus('Searching…', true);
      try {
        const w = await fetchWeather(loc, date);
        setStatus(''); setLoading(false); renderSingle(w);
      } catch(e) { setLoading(false); setStatus(''); showError(e.message); }
      return;
    }

    // Multi-year single day — same as before
    const yearBlocks = buildDates(date, date, years);
    const fromD = new Date(date+'T12:00:00');
    const label = fromD.toLocaleDateString('en-US',{month:'long',day:'numeric'});

    renderYearAccordion(loc, label, yearBlocks, 'single');
  }

  // --- Date range (with optional year repeat) ---
  async function lookupRange() {
    const loc = document.getElementById('locationInput').value.trim();
    const from = document.getElementById('dateFrom').value;
    const to   = document.getElementById('dateTo').value;
    const years = Math.min(30, Math.max(1, parseInt(document.getElementById('rangeYears').value)||1));
    if (!loc) { setStatus('Please enter a location.'); return; }
    if (!from||!to) { setStatus('Please select both dates.'); return; }
    if (from > to) { setStatus('Start date must be before end date.'); return; }

    // Check range length
    const span = Math.round((new Date(to+'T12:00:00') - new Date(from+'T12:00:00')) / 86400000) + 1;
    if (span > 7) { setStatus('Please choose a range of 7 days or fewer.'); return; }

    const fromShort = new Date(from+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const toShort   = new Date(to+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const label = `${fromShort} – ${toShort}`;

    const yearBlocks = buildDates(from, to, years);
    renderYearAccordion(loc, label, yearBlocks, 'range');
  }

  // --- Render accordion of years, each with day rows ---
  function renderYearAccordion(loc, label, yearBlocks, submode) {
    document.getElementById('results').style.display = 'none';
    setLoading(true);
    setStatus(`Fetching data…`, true);

    const resultsEl = document.getElementById('results');
    resultsEl.style.display = 'block';

    const isSingleDay = submode === 'single' && yearBlocks[0].dates.length === 1;

    // If single day multi-year → show bar timeline (simpler)
    if (isSingleDay) {
      resultsEl.innerHTML = `
        <div class="card fade-up">
          <div class="timeline-header">
            <div class="timeline-place" id="tlPlace">…</div>
            <div class="timeline-sub">${label} — year by year</div>
          </div>
          <div id="tlRows">
            ${yearBlocks.map(yb => `
              <div class="loading-row" id="yr-${yb.year}">
                <div style="font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;width:60px;color:var(--muted)">${yb.year}</div>
                <div class="loading-bar"><div class="loading-shimmer"></div></div>
                <div style="font-size:.75rem;color:var(--muted)">…</div>
              </div>`).join('')}
          </div>
        </div>`;
      resultsEl.scrollIntoView({behavior:'smooth',block:'nearest'});

      let resolvedName = loc;
      (async () => {
        for (const yb of yearBlocks) {
          try {
            const w = await fetchWeather(loc, yb.dates[0]);
            if (w.location) { resolvedName = w.location; document.getElementById('tlPlace').textContent = resolvedName; }
            updateBarRow(yb.year, w);
          } catch(e) { updateBarRowError(yb.year); }
        }
        setStatus(''); setLoading(false);
      })();
      return;
    }

    // Multi-day: accordion layout
    resultsEl.innerHTML = `
      <div class="card fade-up">
        <div class="timeline-header">
          <div class="timeline-place" id="tlPlace">…</div>
          <div class="timeline-sub">${label}${yearBlocks.length > 1 ? ' — year by year' : ''}</div>
        </div>
        <div id="tlRows">
          ${yearBlocks.map((yb,i) => `
            <div class="year-block" id="yblock-${yb.year}">
              <div class="year-header" onclick="toggleYear(${yb.year})">
                <div>
                  <div class="year-title">${yb.year}</div>
                  <div class="year-summary" id="ysummary-${yb.year}" style="text-align:left;margin-top:3px">
                    <span style="color:var(--muted);font-size:.7rem"><span class="loading-spinner"></span>loading…</span>
                  </div>
                </div>
                <div style="display:flex;align-items:center">
                  <span class="year-arrow ${i===0?'open':''}" id="yarrow-${yb.year}">▼</span>
                </div>
              </div>
              <div class="year-days ${i===0?'open':''}" id="ydays-${yb.year}">
                ${yb.dates.map(d => `
                  <div class="loading-row" id="day-${yb.year}-${d}" style="padding-left:16px">
                    <div style="font-size:.75rem;color:var(--muted);min-width:90px">${fmtDayShort(d)}</div>
                    <div class="loading-bar"><div class="loading-shimmer"></div></div>
                    <div style="font-size:.75rem;color:var(--muted)">…</div>
                  </div>`).join('')}
              </div>
            </div>`).join('')}
        </div>
      </div>`;
    resultsEl.scrollIntoView({behavior:'smooth',block:'nearest'});

    let resolvedName = loc;
    (async () => {
      for (const yb of yearBlocks) {
        const dayResults = [];
        for (const date of yb.dates) {
          try {
            const w = await fetchWeather(loc, date);
            if (w.location) { resolvedName = w.location; document.getElementById('tlPlace').textContent = resolvedName; }
            updateDayRow(yb.year, date, w);
            dayResults.push(w);
          } catch(e) { updateDayRowError(yb.year, date); }
        }
        updateYearSummary(yb.year, dayResults);
      }
      setStatus(''); setLoading(false);
    })();
  }

  function toggleYear(year) {
    const days  = document.getElementById(`ydays-${year}`);
    const arrow = document.getElementById(`yarrow-${year}`);
    days.classList.toggle('open');
    arrow.classList.toggle('open');
  }

  function updateBarRow(year, w) {
    const row = document.getElementById(`yr-${year}`);
    if (!row) return;
    const avg = (+w.temp_max_c + +w.temp_min_c)/2;
    const icon = getIcon(+w.weather_code);
    const cls = avg<0?'cold':avg<8?'cool':avg<16?'mild':avg<24?'warm':'hot';
    const pct = Math.min(100,Math.max(2,((avg+20)/60)*100));
    const disp = unit==='F' ? toF(avg).toFixed(1)+'°F' : avg.toFixed(1)+'°C';
    row.className = 'year-row';
    row.innerHTML = `
      <div class="year-label">${year}</div>
      <div class="year-bar-track"><div class="year-bar-fill ${cls}" style="width:${pct}%"></div></div>
      <div class="year-meta">
        <div class="year-temp"><span class="year-icon">${icon}</span>${disp}</div>
        <div class="year-cond">${w.condition||''}</div>
      </div>`;
  }

  function updateBarRowError(year) {
    const row = document.getElementById(`yr-${year}`);
    if (!row) return;
    row.className = 'year-row';
    row.innerHTML = `<div class="year-label">${year}</div><div style="flex:1;font-size:.7rem;color:var(--muted)">No data</div><div>—</div>`;
  }

  function updateDayRow(year, date, w) {
    const row = document.getElementById(`day-${year}-${date}`);
    if (!row) return;
    const icon = getIcon(+w.weather_code);
    const d = new Date(date+'T12:00:00');
    const dayName = d.toLocaleDateString('en-US',{weekday:'short'});
    row.className = 'day-row';
    row.innerHTML = `
      <div>
        <div class="day-name">${dayName}</div>
        <div class="day-date">${fmtDayShort(date)}</div>
      </div>
      <div>
        <div style="font-size:1.3rem">${icon}</div>
        <div class="day-condition">${w.condition||''}</div>
      </div>
      <div>
        <div class="day-temps">${fmtS(w.temp_max_c)} / ${fmtS(w.temp_min_c)}</div>
        <div class="day-temps-sub">hi / lo</div>
      </div>`;
  }

  function updateDayRowError(year, date) {
    const row = document.getElementById(`day-${year}-${date}`);
    if (!row) return;
    row.className = 'day-row';
    row.innerHTML = `<div>${fmtDayShort(date)}</div><div style="color:var(--muted);font-size:.7rem">No data</div><div>—</div>`;
  }

  function updateYearSummary(year, results) {
    const el = document.getElementById(`ysummary-${year}`);
    if (!el || !results.length) return;
    const avgMax = results.reduce((s,w)=>s+ +w.temp_max_c,0)/results.length;
    const avgMin = results.reduce((s,w)=>s+ +w.temp_min_c,0)/results.length;
    el.innerHTML = `<span style="color:var(--ink)">${fmtS(avgMax)} / ${fmtS(avgMin)}</span> <span style="color:var(--muted)">avg hi/lo · ${results.length} days</span>`;
  }

  // --- Core fetch ---
  async function fetchWeather(loc, date) {
    const prompt = `Give historical weather data for "${loc}" on ${date}. Return ONLY a JSON object:
{"location":"city, country","date":"${date}","temp_max_c":number,"temp_min_c":number,"precipitation_mm":number,"wind_max_kmh":number,"weather_code":number,"condition":"short description","hourly_temps_c":[24 numbers],"timezone":"e.g. CET"}
Realistic climate estimates. No markdown, no explanation, only the JSON.`;

    const resp = await fetch('/.netlify/functions/weather',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt})
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message||'API error');
    const raw = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const clean = raw.replace(/```json|```/g,'').trim();
    const match = clean.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('Could not parse response.');
    return JSON.parse(match[0]);
  }

  // --- Single result render ---
  function renderSingle(w) {
    const avg = (+w.temp_max_c + +w.temp_min_c)/2;
    const icon = getIcon(+w.weather_code);
    const hourly = Array.isArray(w.hourly_temps_c) ? w.hourly_temps_c : [];
    const tMin=Math.min(...hourly), tMax=Math.max(...hourly), tR=tMax-tMin||1;
    const bars = hourly.map((t,i)=>{
      const h=Math.max(4,Math.round(((+t-tMin)/tR)*58+4));
      const tip=unit==='F'?`${i}:00 · ${toF(+t).toFixed(1)}°F`:`${i}:00 · ${(+t).toFixed(1)}°C`;
      return `<div class="hour-bar-wrap"><div class="hour-bar" style="height:${h}px"><div class="hour-bar-tip">${tip}</div></div></div>`;
    }).join('');
    const labels=Array.from({length:24},(_,i)=>`<div class="hour-label">${i%6===0?i+'h':''}</div>`).join('');
    const el=document.getElementById('results');
    el.style.display='block';
    el.innerHTML=`
      <div class="card fade-up">
        <div class="result-header">
          <div class="result-place">${w.location}</div>
          <div class="result-date">${fmtDateLong(w.date)}</div>
        </div>
        <div class="weather-icon">${icon}</div>
        <div class="temp-main">${fmt(avg)}</div>
        <div class="temp-range">↑ ${fmt(w.temp_max_c)} high &nbsp;·&nbsp; ↓ ${fmt(w.temp_min_c)} low</div>
        <div class="condition-text">${w.condition}</div>
        <div class="stats-grid">
          <div class="stat"><div class="stat-val">${fmt(w.temp_max_c)}</div><div class="stat-label">High</div></div>
          <div class="stat"><div class="stat-val">${fmt(w.temp_min_c)}</div><div class="stat-label">Low</div></div>
          <div class="stat"><div class="stat-val">${w.precipitation_mm!=null?Number(w.precipitation_mm).toFixed(1):'—'} mm</div><div class="stat-label">Precip</div></div>
          <div class="stat"><div class="stat-val">${w.wind_max_kmh!=null?Math.round(+w.wind_max_kmh):'—'}</div><div class="stat-label">Max Wind km/h</div></div>
          <div class="stat"><div class="stat-val">${w.timezone||'—'}</div><div class="stat-label">Timezone</div></div>
          <div class="stat"><div class="stat-val">${w.date}</div><div class="stat-label">Date</div></div>
        </div>
        ${hourly.length?`<div class="hourly-title">Hourly Temperature</div><div class="hourly-chart">${bars}</div><div class="hour-labels">${labels}</div>`:''}
      </div>`;
    el.scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  function showError(msg) {
    const el=document.getElementById('results');
    el.style.display='block';
    el.innerHTML=`<div class="card error-msg">⚠ ${msg||'Something went wrong. Please try again.'}</div>`;
  }

  // --- Helpers ---
  const WMO={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',85:'🌨️',86:'❄️',95:'⛈️',96:'⛈️',99:'⛈️'};
  function getIcon(c){if(WMO[c])return WMO[c];if(c<=3)return'🌤️';if(c<=49)return'🌫️';if(c<=69)return'🌧️';if(c<=79)return'❄️';return'⛈️';}
  function fmtDateLong(ds){return new Date(ds+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});}
  function fmtDayShort(ds){return new Date(ds+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
